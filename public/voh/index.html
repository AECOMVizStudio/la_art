<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
  <title>Virtual Open House – Language Selection</title>
  <base href="/voh/">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hub-container">
    <img src="assets/lashp_logo.webp" alt="Los Angeles State Historic Park logo" class="hub-logo" />
    <!-- Page-level Title -->
    <h1 class="hub-title">Welcome to the Virtual Open House</h1>
    
    <!-- Subtitle / Purpose -->
    <p class="hub-subtitle">
      Explore the space in your preferred language. Select a version below to begin your tour.
    </p>

    <div class="language-grid">
      <a href="la-art-en-es/app-files/index.html" class="lang-card" aria-label="Visit English and Spanish tour">
        <h2>EN / ES</h2>
        <p>English / Español</p>
      </a>
      <a href="la-art-cn/app-files/index.html" class="lang-card" aria-label="Visit Chinese tour">
        <h2>简体中文 / 繁体中文</h2>
        <p>Simplified / Traditional Chinese</p>
      </a>
    </div>
  </main>
</body>
</html>
